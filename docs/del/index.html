<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vidhang</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 0 20px;
      line-height: 1.5;
      color: #333;
    }
    h1, h2 {
      margin-top: 0;
    }
    .card {
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 24px;
      background: #fafafa;
    }
    .form-group {
      margin-bottom: 14px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      font-size: 14px;
    }
    input[type="text"],
    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 8px 12px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 14px;
    }
    button {
      padding: 8px 16px;
      background-color: #2563eb;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      cursor: pointer;
      margin-right: 8px;
      margin-top: 4px;
    }
    button:hover {
      background-color: #1d4ed8;
    }
    button.oauth-google {
      background-color: #ea4335;
    }
    button.oauth-google:hover {
      background-color: #d93025;
    }
    button.oauth-twitch {
      background-color: #9146ff;
    }
    button.oauth-twitch:hover {
      background-color: #772ce8;
    }
    button.btn-secondary {
      background-color: #64748b;
    }
    button.btn-secondary:hover {
      background-color: #475569;
    }
    .oauth-group {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px dashed #d1d5db;
    }
    .status-msg {
      margin-top: 10px;
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 14px;
      display: none;
    }
    .status-msg.error {
      display: block;
      background-color: #fee2e2;
      color: #991b1b;
      border: 1px solid #f87171;
    }
    .status-msg.success {
      display: block;
      background-color: #dcfce7;
      color: #166534;
      border: 1px solid #86efac;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <h1>Vidhang</h1>

  <!-- Auth Section -->
  <section id="auth-section" class="card">
    <h2>Log In</h2>
    <form id="login-form">
      <div class="form-group">
        <label for="login-email">Email</label>
        <input type="email" id="login-email" required autocomplete="email">
      </div>
      <div class="form-group">
        <label for="login-password">Password</label>
        <input type="password" id="login-password" required autocomplete="current-password">
      </div>
      <button type="submit" id="btn-login">Log In with Email</button>
      <button type="button" id="btn-signup" class="btn-secondary">Sign Up</button>
    </form>

    <div class="oauth-group">
      <p style="margin: 0 0 10px 0; font-size: 14px; font-weight: 600;">Or sign in with OAuth:</p>
      <button type="button" id="btn-google" class="oauth-google">Log In with Google</button>
      <button type="button" id="btn-twitch" class="oauth-twitch">Log In with Twitch</button>
    </div>

    <div id="auth-status" class="status-msg"></div>
  </section>

  <!-- User Profile Section -->
  <section id="user-section" class="card hidden">
    <h2>Account</h2>
    <p>Logged in as: <strong id="user-username">Loading...</strong></p>
    <p style="font-size: 13px; color: #6b7280;">User ID: <span id="user-id"></span></p>
    <button type="button" id="btn-logout" class="btn-secondary">Log Out</button>
  </section>

  <!-- Add Game Form Section -->
  <section id="game-section" class="card hidden">
    <h2>Submit New Game</h2>
    <form id="game-form">
      <div class="form-group">
        <label for="game-title">Title</label>
        <input type="text" id="game-title" required placeholder="e.g. Half-Life 2">
      </div>
      <div class="form-group">
        <label for="game-slug">Slug</label>
        <input type="text" id="game-slug" required placeholder="e.g. half-life-2">
      </div>
      <div class="form-group">
        <label for="game-steam-id">Steam ID</label>
        <input type="text" id="game-steam-id" placeholder="e.g. 220">
      </div>
      <button type="submit" id="btn-submit-game">Submit Game</button>
    </form>
    <div id="game-status" class="status-msg"></div>
  </section>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="main.js"></script>
</body>
</html>
