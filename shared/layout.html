<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{PAGE_TITLE}} | {{SITE_TITLE}}</title>
    <meta name="description" content="{{PAGE_DESC}}">
    
    <script async src="https://www.googletagmanager.com/gtag/js?id={{GTAG}}"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', '{{GTAG}}');
    </script>
    
    {{JSON_LD}}
    <link rel="stylesheet" href="/css/main.css">
</head>
<body>
    <nav class="breadcrumbs" style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 20px;">
        <div id="breadcrumb-container">
            {{BREADCRUMB}}
        </div>
        <div style="display: flex; align-items: baseline; gap: 20px;">
            <div style="font-size: 0.75rem; color: #666; text-transform: uppercase;">Updated: <time datetime="{{BUILD_DATE_ISO}}">{{BUILD_DATE_READABLE}}</time></div>
            <div class="auth-dropdown-container">
                <button id="auth-user-btn" class="auth-trigger">Loading...</button>
                <div id="auth-dropdown-menu" class="auth-menu-content"></div>
            </div>
        </div>
    </nav>
    
    <main>
        {{CONTENT}}
    </main>
</body>
</html>
